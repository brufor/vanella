    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

        }


        body {

            overflow: hidden;

            background: #000;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            cursor: none;

        }


        /* =====================================
           VIDÉO
           ===================================== */

        .video-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 0;

            filter:
                brightness(0.90)
                contrast(1.10)
                saturate(1.08);

            transform: scale(1.015);

        }


        .overlay {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0,0,0,0.05),
                    rgba(0,0,0,0.48)
                );

        }


        /* =====================================
           PARTICULES
           ===================================== */

        #particles {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            pointer-events: none;

        }


        /* =====================================
           CURSEUR ÉPÉE
           ===================================== */

        #sword-cursor {

            position: fixed;

            width: 70px;
            height: 70px;

            left: 0;
            top: 0;

            z-index: 999999;

            pointer-events: none;

            transform:
                translate(-12px,-12px)
                rotate(-45deg);

            filter:
                drop-shadow(0 0 5px white)
                drop-shadow(0 0 12px #7fc8ff)
                drop-shadow(0 0 24px #258cff);

        }


        .sword-blade {

            position: absolute;

            left: 31px;
            top: 3px;

            width: 8px;
            height: 48px;

            background:
                linear-gradient(
                    90deg,
                    #555,
                    #fff,
                    #dcecff,
                    #777
                );

            clip-path:
                polygon(
                    20% 0,
                    80% 0,
                    100% 88%,
                    50% 100%,
                    0 88%
                );

        }


        .sword-blade::after {

            content: "";

            position: absolute;

            left: 2px;
            top: 4px;

            width: 2px;
            height: 34px;

            background: white;

        }


        .sword-guard {

            position: absolute;

            left: 17px;
            top: 44px;

            width: 36px;
            height: 6px;

            border-radius: 8px;

            background:
                linear-gradient(
                    90deg,
                    #555,
                    #fff,
                    #777
                );

            box-shadow:
                0 0 8px white;

        }


        .sword-handle {

            position: absolute;

            left: 31px;
            top: 49px;

            width: 8px;
            height: 17px;

            border-radius: 3px;

            background:
                repeating-linear-gradient(
                    135deg,
                    #111 0px,
                    #111 3px,
                    #aaa 4px,
                    #111 6px
                );

        }


        .sword-pommel {

            position: absolute;

            left: 29px;
            top: 63px;

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #aaa 45%,
                    #444
                );

            box-shadow:
                0 0 10px white;

        }


        /* =====================================
           TRAÎNÉE CURSEUR
           ===================================== */

        .cursor-trail {

            position: fixed;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: white;

            z-index: 999998;

            pointer-events: none;

            box-shadow:
                0 0 8px white,
                0 0 18px #48aaff;

            animation:
                trailFade 0.5s forwards;

        }


        @keyframes trailFade {

            from {

                opacity: .85;

                transform:
                    scale(1);

            }

            to {

                opacity: 0;

                transform:
                    scale(0);

            }

        }


        /* =====================================
           CLIC LUMINEUX
           ===================================== */

        .click-effect {

            position: fixed;

            width: 12px;
            height: 12px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 999997;

            border:
                2px solid white;

            box-shadow:
                0 0 10px white,
                0 0 25px #4da6ff,
                0 0 50px #4da6ff;

            animation:
                clickExplosion .65s ease-out forwards;

        }


        @keyframes clickExplosion {

            0% {

                opacity: 1;

                transform:
                    translate(-50%,-50%)
                    scale(.2);

            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%,-50%)
                    scale(7);

            }

        }


        /* =====================================
           PROFIL
           ===================================== */

        .profil {

            position: relative;

            z-index: 5;

            width:
                min(92vw, 460px);

            min-height: 100vh;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        .photo-container {

            margin-bottom: 20px;

        }


        .photo-container::before {

            content: "";

            position: absolute;

                halo 3s infinite ease-in-out;

        }


        .photo-profil {

            box-shadow:

                transform .35s ease,

        }


        .photo-profil:hover {

                scale(1.08)

            box-shadow:

        h1 {

                transform .3s ease;

            transform:
                scale(1.06);

        }


        /* =====================================
           STATUT

        .activite {

            margin-top: 14px;

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 15px;

        .point {

        /* =====================================

        .badge:hover {

                rgba(255,255,255,.12);

        }


        /* =====================================
           CARTE ACTIVITÉ
           ===================================== */

        .jeu-card {

        }

                rgba(255,255,255,.45);

        }


        .jeu-nom {

            margin-top: 3px;

            white-space: nowrap;

        }


        .jeu-details {

            margin-top: 3px;

            font-size: 13px;

                rgba(255,255,255,.7);

            overflow: hidden;

        }


        .jeu-timing {

            margin-top: 4px;

            font-size: 11px;

            color:
                rgba(255,255,255,.4);

        }


        /* =====================================
           VUES
           ===================================== */

        .views {

            margin-top: 13px;

            padding:
                6px 11px;

            border-radius: 999px;

            font-size: 11px;

            color:
                rgba(255,255,255,.55);

            background:
                rgba(0,0,0,.4);

            border:
                1px solid
                rgba(255,255,255,.1);

            backdrop-filter:
                blur(10px);

        }


        /* =====================================
           SON
           ===================================== */

        .sound-button {

            position: fixed;

            right: 25px;

            width: 58px;
            height: 58px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.2);

            background:
                rgba(10,10,10,.6);

            color: white;

            backdrop-filter:
                blur(14px);

            transition:
                transform .2s ease;

        }


        .sound-button:hover {

            transform:
                scale(1.1);

        }


        /* =====================================
           ANIMATIONS
           ===================================== */

        @keyframes apparition {

            from {

                opacity: 0;

                transform:
                    translateY(25px)

            }

            to {

        @keyframes halo {

        /* =====================================

        }

    </style>

</head>


<body>


    <!-- =====================================

                class="photo-profil"

                class="point"

    <script>


        /* =====================================
           ID DISCORD
           ===================================== */

        /*
           ⚠️ GARDE TON VRAI ID DISCORD
           ENTRE LES GUILLEMETS.
        */

        const DISCORD_ID =
            "1297944987593605262";


        /* =====================================
           CURSEUR
           ===================================== */

        const sword =
            document.getElementById(
                "sword-cursor"
            );


        let mouseX = 0;
        let mouseY = 0;

        let cursorX = 0;
        let cursorY = 0;


        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;

            }
        );


        function animateCursor() {

            cursorX +=
                (mouseX - cursorX)
                * 0.35;

            cursorY +=
                (mouseY - cursorY)
                * 0.35;


            sword.style.left =
                cursorX + "px";

            sword.style.top =
                cursorY + "px";


            requestAnimationFrame(
                animateCursor
            );

        }


        animateCursor();


        /* =====================================
           TRAÎNÉE
           ===================================== */

        let lastX = 0;
        let lastY = 0;


        document.addEventListener(
            "mousemove",
            function(event) {

                const distance =
                    Math.hypot(
                        event.clientX - lastX,
                        event.clientY - lastY
                    );


                if (distance > 22) {

                    const trail =
                        document.createElement(
                            "div"
                        );


                    trail.className =
                        "cursor-trail";


                    trail.style.left =
                        event.clientX + "px";


                    trail.style.top =
                        event.clientY + "px";


                    document.body.appendChild(
                        trail
                    );


                    setTimeout(
                        function() {

                            trail.remove();

                        },
                        500
                    );


                    lastX =
                        event.clientX;

                    lastY =
                        event.clientY;

                }

            }
        );


        /* =====================================
           EFFET CLIC
           ===================================== */

        document.addEventListener(
            "click",
            function(event) {

                const effect =
                    document.createElement(
                        "div"
                    );


                effect.className =
                    "click-effect";


                effect.style.left =
                    event.clientX + "px";


                effect.style.top =
                    event.clientY + "px";


                document.body.appendChild(
                    effect
                );


                setTimeout(
                    function() {

                        effect.remove();

                    },
                    700
                );

            }
        );


        /* =====================================
           PARTICULES
           ===================================== */

        const canvas =
            document.getElementById(
                "particles"
            );


        const ctx =
            canvas.getContext("2d");


        let particles = [];


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        for (
            let i = 0;
            i < 55;
            i++
        ) {

            particles.push({

                x:
                    Math.random()
                    * window.innerWidth,

                y:
                    Math.random()
                    * window.innerHeight,

                size:
                    Math.random() * 2 + 0.5,

                speed:
                    Math.random() * 0.35 + 0.1,

                opacity:
                    Math.random() * 0.5 + 0.15

            });

        }


        function animateParticles() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(
                function(p) {

                    p.y -= p.speed;


                    if (p.y < -10) {

                        p.y =
                            canvas.height + 10;

                    }


                    ctx.beginPath();


                    ctx.arc(
                        p.x,
                        p.y,
                        p.size,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `rgba(
                            255,
                            255,
                            255,
                            ${p.opacity}
                        )`;


                    ctx.fill();

                }
            );


            requestAnimationFrame(
                animateParticles
            );

        }


        animateParticles();


        /* =====================================
           DISCORD
           ===================================== */

        const couleurs = {

            online: "#00ff88",

            idle: "#ffaa00",

            dnd: "#ff4444",

            offline: "#777777"

        };


        const nomsStatut = {

            online: "EN LIGNE",

            idle: "ABSENT",

            dnd: "NE PAS DÉRANGER",

            offline: "HORS LIGNE"

        };


        let debutActivite = null;


        async function chargerDiscord() {

            try {

                const response =
                    await fetch(
                        "https://api.lanyard.rest/v1/users/"
                        + DISCORD_ID
                    );


                const result =
                    await response.json();


                if (!result.success) {

                    throw new Error(
                        "Lanyard indisponible"
                    );

                }


                const data =
                    result.data;


                const statut =
                    data.discord_status
                    || "offline";


                const couleur =
                    couleurs[statut]
                    || couleurs.offline;


                const statutElement =
                    document.getElementById(
                        "statut"
                    );


                const point =
                    document.getElementById(
                        "point"
                    );


                statutElement.textContent =
                    nomsStatut[statut];


                statutElement.style.color =
                    couleur;


                point.style.background =
                    couleur;


                point.style.boxShadow =
                    "0 0 8px "
                    + couleur
                    + ", 0 0 18px "
                    + couleur;


                /* =================================
                   ACTIVITÉ
                   ================================= */

                const activities =
                    data.activities || [];


                const activity =
                    activities.find(
                        function(a) {

                            return a.type === 0;

                        }
                    );


                const card =
                    document.getElementById(
                        "jeuCard"
                    );


                if (!activity) {

                    card.classList.remove(
                        "visible"
                    );

                    debutActivite =
                        null;

                }
                else {

                    document.getElementById(
                        "jeuNom"
                    ).textContent =
                        activity.name
                        || "Activité";


                    document.getElementById(
                        "jeuDetails"
                    ).textContent =
                        activity.details
                        || activity.state
                        || "En cours";


                    if (
                        activity.timestamps
                        &&
                        activity.timestamps.start
                    ) {

                        debutActivite =
                            activity.timestamps.start;

                    }
                    else {

                        debutActivite =
                            null;

                    }


                    card.classList.add(
                        "visible"
                    );

                }


                /* =================================
                   BADGES
                   ================================= */

                const badges =
                    document.getElementById(
                        "badges"
                    );


                badges.innerHTML = "";


                badges.innerHTML +=
                    `<span class="badge">
                        🟢 DISCORD
                    </span>`;


                if (statut === "online") {

                    badges.innerHTML +=
                        `<span class="badge">
                            ⚡ ONLINE
                        </span>`;

                }


                if (activity) {

                    badges.innerHTML +=
                        `<span class="badge">
                            🎮 GAMING
                        </span>`;

                }


                badges.innerHTML +=
                    `<span class="badge">
                        ✦ PROFILE
                    </span>`;

            }
            catch (error) {

                console.error(error);


                document.getElementById(
                    "statut"
                ).textContent =
                    "HORS LIGNE";


                document.getElementById(
                    "statut"
                ).style.color =
                    couleurs.offline;


                document.getElementById(
                    "point"
                ).style.background =
                    couleurs.offline;

            }

        }


        /* =====================================
           TIMER ACTIVITÉ
           ===================================== */

        function afficherTemps() {

            const timing =
                document.getElementById(
                    "jeuTiming"
                );


            if (!debutActivite) {

                timing.textContent =
                    "";

                return;

            }


            const total =
                Math.floor(
                    (
                        Date.now()
                        -
                        debutActivite
                    ) / 1000
                );


            const heures =
                Math.floor(
                    total / 3600
                );


            const minutes =
                Math.floor(
                    (total % 3600) / 60
                );


            const secondes =
                total % 60;


            if (heures > 0) {

                timing.textContent =
                    "Depuis "
                    + heures
                    + "h "
                    + minutes
                    + "min";

            }
            else {

                timing.textContent =
                    "Depuis "
                    + minutes
                        .toString()
                        .padStart(2,"0")
                    + "min "
                    + secondes
                        .toString()
                        .padStart(2,"0")
                    + "s";

            }

        }


        /* =====================================
           COMPTEUR DE VUES
           ===================================== */

        let vues =
            parseInt(
                localStorage.getItem(
                    "brufor_profile_views"
                )
            );


        if (isNaN(vues)) {

            vues = 0;

        }


        vues++;


        localStorage.setItem(
